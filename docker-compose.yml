services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  warp:
    image: caomingjun/warp:latest
    restart: always
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "1080:1080"



  web:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - REMOVE_DB_ON_STARTUP=true
      - REMOVE_DB_ON_SHUTDOWN=true
    depends_on:
      - redis
    volumes:
      - .:/app


  worker:
    build: .
    # Appended --pool=solo to prevent PyTorch fork deadlocks
    command: celery -A worker worker --loglevel=info --pool=solo
    environment:
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2 # Added for NumPy/SciPy thread control
      - WARP_PROXY=socks5://warp:1080
    depends_on:
      - redis
      - warp
    volumes:
      - .:/app